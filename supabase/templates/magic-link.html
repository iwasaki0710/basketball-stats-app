<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>COURTVISION ログインリンク</title>
  </head>
  <body
    style="
      margin: 0;
      background: #0d1117;
      color: #eef1f4;
      font-family: Arial, &quot;Hiragino Kaku Gothic ProN&quot;, sans-serif;
      padding: 32px 16px;
    "
  >
    <div
      style="
        max-width: 500px;
        margin: auto;
        border: 1px solid #303b46;
        border-radius: 12px;
        background: #151b23;
        padding: 32px;
      "
    >
      <p style="font-size: 11px; letter-spacing: 3px; color: #c1f36b">
        COURTVISION
      </p>
      <h1 style="font-size: 23px; line-height: 1.6">チームの次の一歩へ。</h1>
      <p style="font-size: 14px; line-height: 1.9; color: #b1becd">
        下のボタンからログインしてください。このメールを開いたブラウザでチームのワークスペースへ移動します。
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #c1f36b;
            color: #182013;
            padding: 14px 24px;
            border-radius: 7px;
            font-weight: bold;
            text-decoration: none;
          "
          >COURTVISION にログイン</a
        >
      </p>
      <p style="font-size: 12px; line-height: 1.9; color: #7e8da0">
        ログイン操作に心当たりがない場合は、このメールを破棄してください。リンクを他の人へ転送しないでください。
      </p>
    </div>
  </body>
</html>
